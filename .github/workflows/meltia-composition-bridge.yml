name: Meltia composition shadow bridge
on:
  push:
    paths:
      - 'src/Meltia.CompositionBridge/**'
      - 'tests/Meltia.CompositionBridge.Tests/**'
      - 'tests/Meltia.BoundaryEvaluation/**'
      - 'tools/Meltia.BoundaryBenchmark/**'
      - 'src/Meltia.Core/**'
      - 'src/Meltype.Core/**'
      - '.github/workflows/meltia-composition-bridge.yml'
  pull_request:
    paths:
      - 'src/Meltia.CompositionBridge/**'
      - 'tests/Meltia.CompositionBridge.Tests/**'
      - 'tests/Meltia.BoundaryEvaluation/**'
      - 'tools/Meltia.BoundaryBenchmark/**'
      - 'src/Meltia.Core/**'
      - 'src/Meltype.Core/**'
      - '.github/workflows/meltia-composition-bridge.yml'
permissions:
  contents: read
jobs:
  bridge-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build actual Meltype + Meltia reference bridge
        run: dotnet build src/Meltia.CompositionBridge/Meltia.CompositionBridge.csproj -c Release --nologo
      - name: Run read-only bridge contract tests
        run: dotnet run --project tests/Meltia.CompositionBridge.Tests/Meltia.CompositionBridge.Tests.csproj -c Release
      - name: Keep base boundary regression coverage
        run: dotnet run --project tests/Meltia.Core.Tests/Meltia.Core.Tests.csproj -c Release
      - name: Build and run synthetic gold boundary evaluation (no accuracy threshold yet)
        run: |
          dotnet run --project tests/Meltia.BoundaryEvaluation/Meltia.BoundaryEvaluation.csproj -c Release -- --output artifacts/meltia-boundary-evaluation.json
      - name: Evaluate 530 additional synthetic robustness cases (not a blind holdout)
        run: |
          dotnet run --project tests/Meltia.BoundaryEvaluation/Meltia.BoundaryEvaluation.csproj -c Release -- --output artifacts/meltia-boundary-robustness.json --suite robustness
      - name: Evaluate 290 additional synthetic vocabulary-shift and Japanese-negative cases
        run: |
          dotnet run --project tests/Meltia.BoundaryEvaluation/Meltia.BoundaryEvaluation.csproj -c Release -- --output artifacts/meltia-boundary-generalization.json --suite generalization
      - name: Evaluate 56 fixed adversarial ambiguity and mixed-script cases
        run: |
          dotnet run --project tests/Meltia.BoundaryEvaluation/Meltia.BoundaryEvaluation.csproj -c Release -- --output artifacts/meltia-boundary-adversarial.json --suite adversarial
      - name: Measure independent Core p50/p95/p99 and allocated bytes
        run: |
          dotnet run --project tools/Meltia.BoundaryBenchmark/Meltia.BoundaryBenchmark.csproj -c Release -- --output artifacts/meltia-boundary-performance.json
      - name: Upload per-case boundary evaluation report even on evaluator failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meltia-boundary-evaluation
          path: artifacts/meltia-boundary-*.json
          if-no-files-found: warn
