name: Meltia boundary quality
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'smoke: 47+56 cases; full: all 923 cases plus performance'
        required: true
        type: choice
        options: [smoke, full]
        default: smoke
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/Meltia.CompositionBridge/**'
      - 'tests/Meltia.CompositionBridge.Tests/**'
      - 'tests/Meltia.BoundaryEvaluation/**'
      - 'tools/Meltia.BoundaryBenchmark/**'
      - 'tools/run-meltia-quality.py'
      - 'src/Meltia.Core/**'
      - 'src/Meltype.Core/**'
      - '.github/workflows/meltia-composition-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'src/Meltia.CompositionBridge/**'
      - 'tests/Meltia.CompositionBridge.Tests/**'
      - 'tests/Meltia.BoundaryEvaluation/**'
      - 'tools/Meltia.BoundaryBenchmark/**'
      - 'tools/run-meltia-quality.py'
      - 'src/Meltia.Core/**'
      - 'src/Meltype.Core/**'
      - '.github/workflows/meltia-composition-bridge.yml'

permissions:
  contents: read

concurrency:
  group: meltia-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-contracts:
    # Draft PRs run locally: no minute usage until Ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run read-only boundary quality checks
        env:
          QUALITY_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'smoke' }}
        run: |
          python3 tools/run-meltia-quality.py --tier "$QUALITY_TIER" --output-dir artifacts/meltia-quality
      - name: Upload quality logs and per-suite JSON (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meltia-quality
          path: artifacts/meltia-quality/
          if-no-files-found: warn
          retention-days: 7
