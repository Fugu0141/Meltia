name: linux

# Linux 版 (linux/、IBus) をビルドして、テスター向けの zip を実行結果 (Artifacts) に置く。
# PRではIBus/Mozc実統合を同一HEADで検証し、Windowsの実キーE2Eとは分ける。
# 手動のOS別受け入れ試験: docs/MELTIA_OS_E2E_VERIFICATION.md
# Actionsから手動で実行するか、対象コードを変更したPR/mainで実行する。
# このワークフローは配布を行わず、検証用ZIPをActions Artifactにのみ保存する。
# Meltiaの既存v*リリースは変更しない。将来のLinux公開は別途レビューした専用手順で行う。
# Mozc のビルドは初回 30〜40 分かかるので、Bazel の結果をキャッシュして次から速くする。
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'linux/**'
      - 'native/mozc/**'
      - 'src/Meltype.Core/**'
      - 'src/Meltype.Core.Tests/**'
      - 'dictionaries/**'
      - 'tools/test-native-boundaries.py'
      - '.github/workflows/linux.yml'
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - 'native/mozc/**'
      - 'src/Meltype.Core/**'
      - 'dictionaries/**'
      - 'tools/test-native-boundaries.py'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # Expensive Mozc integration runs on review-ready PRs; drafts can test locally.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # IBus のエンジン (Python) の書き間違いを、時間のかかるビルドの前に見つける
      - name: Check Python
        run: python3 -c "import ast; ast.parse(open('linux/ibus-engine-meltype', encoding='utf-8').read())"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      # Mozc の Linux のビルドと、NativeAOT のリンクに使うもの
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config zlib1g-dev python3 python3-gi gir1.2-ibus-1.0 \
            ibus dbus-x11 xvfb xauth \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libibus-1.0-dev libxcb-xfixes0-dev qt6-base-dev \
            cmake fcitx5 fcitx5-modules-dev libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/bazel-cache
            ~/mozc/src/third_party_cache
          key: mozc-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      # Bazelisk は版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる。
      - name: Bazelisk
        run: |
          mkdir -p "$HOME/tools"
          curl -fsSL -o "$HOME/tools/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $HOME/tools/bazelisk" | sha256sum -c -
          chmod +x "$HOME/tools/bazelisk"
      - name: Build Mozc helper
        run: BAZEL="$HOME/tools/bazelisk" native/mozc/build-mozc-helper.sh "$HOME/mozc" "$HOME/bazel-cache"
      - name: Build
        run: linux/build.sh
      # fcitx5 のアドオンを、fcitx5 のテスト用のフロントエンドで動かす。Mozc を外した本体だけで、かなの確定と変換の候補を見る
      - name: Test fcitx5 addon
        run: |
          mkdir -p linux/build/fcitx5-native
          cp linux/build/Meltype-linux/libMeltypeNative.so linux/build/fcitx5-native/
          cmake -S linux/fcitx5 -B linux/build/fcitx5-test -DBUILD_TESTING=ON
          cmake --build linux/build/fcitx5-test
          HOME="$RUNNER_TEMP/fcitx5-home" MELTYPE_DIR="$PWD/linux/build/fcitx5-native" ctest --test-dir linux/build/fcitx5-test --output-on-failure
      - name: NativeAOT boundary tests
        run: python3 tools/test-native-boundaries.py linux/build/Meltype-linux/libMeltypeNative.so
      - name: IBus and real Mozc integration tests
        run: timeout 120 python3 linux/tests/test_integration.py linux/build/Meltype-linux
      - name: Private IBus daemon tests
        run: timeout 120 xvfb-run -a dbus-run-session -- python3 linux/tests/test_daemon.py linux/build/Meltype-linux
      - name: Package
        run: |
          # 検証用ZIPのみ作る。タグ名を配布アーカイブ名に使わない。
          name="Meltype-linux-test-${GITHUB_SHA:0:12}.zip"
          (cd linux/build && zip -qr "$name" Meltype-linux)
          ls -la linux/build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meltype-linux
          path: linux/build/Meltype-*.zip
          retention-days: 14
