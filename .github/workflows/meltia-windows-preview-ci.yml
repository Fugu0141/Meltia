  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meltia-preview-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t4c3-posix:
    name: T4-C3 POSIX FIFO and nonblocking read regressions (no OS probes)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: "T4-C3: time-bounded FIFO, open-time replacement and fstat drift"
        run: python3 tools/test_meltia_t4c3_observer_hash_review.py
      - name: "T4-B5: nonblocking evidence reader and FIFO-swap regression (NO OS probes)"
        run: python3 tools/test_meltia_t4b5_offline_review_gate.py
      - name: "T4-C4: offline private-record FIFO rejection (NO VM/TSF calls)"
        run: python3 tools/test_meltia_t4c4_vm_snapshot_review.py
      - name: "T4-C5: synthetic multi-session, collision and evidence claims (NO VM)"
        run: python3 tools/test_meltia_t4c5_multi_session_review.py
  windows-preview:
    # Run even on Draft PRs: review must see the actual Preview EXE validation.
    name: Windows Meltia.exe publish, smoke and audit
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Verify Meltia T2 disabled TSF identity contract (offline only)
        shell: pwsh
        run: |
          python tools/test_meltia_t2_identity_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Meltia T2 identity contract failed.' }
      - name: "T4-A: read-only TSF registration preflight contract (NO registry access)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4a_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-A offline preflight contract failed.' }
      - name: "T4-B1: TSF profile audit synthetic x64/x86 + offline rejection tests (NO TSF enumeration)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4b_audit_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-B1 offline audit gate tests failed.' }
          ./tools/test-meltia-t4b-profile-audit.ps1
          if ($LASTEXITCODE -ne 0) { throw 'T4-B1 native synthetic profile audit failed.' }
      - name: "T4-B2: offline ownership and rollback simulations (NO TSF registration)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4b2_ownership_model.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-B2 rollback model tests failed.' }
          python tools/meltia_t4b2_ownership_model.py --simulate-prefix 4
          if ($LASTEXITCODE -ne 0) { throw 'T4-B2 offline simulation failed.' }
      - name: "T4-B3: synthetic attribute/category evidence gate (NO TSF API access)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4b3_evidence_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-B3 evidence rejection tests failed.' }
      - name: "T4-B6: native TSF observer synthetic x64/x86 (NO COM calls)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4b6_identity_snapshot.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-B6 identity snapshot validation failed.' }
          ./tools/test-meltia-t4b6-vm-observer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'T4-B6 native synthetic tests failed.' }
      - name: "T4-C1: synthetic VM capture order and build-only observer checks (NO live TSF)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4c1_vm_evidence_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-C1 synthetic evidence orchestration tests failed.' }
          $stage = Join-Path $env:TEMP ('meltia-t4c1-ci-' + [Guid]::NewGuid().ToString('N'))
          try {
            ./tools/build-meltia-t4c1-vm-observers.ps1 -Output $stage
            if ($LASTEXITCODE -ne 0) { throw 'T4-C1 x64/x86 build-only observers failed.' }
          }
          finally {
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: "T4-C2: offline evidence bundle drift and collision precedence (NO OS probes)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4c2_offline_bundle_review.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-C2 offline evidence bundle tests failed.' }
      - name: "T4-C3: offline observer EXE bytes and out-of-band hash comparison (NO OS probes)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4c3_observer_hash_review.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-C3 offline observer hash comparison tests failed.' }
      - name: "T4-C4: private VM snapshot metadata review (synthetic, NO VM access)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4c4_vm_snapshot_review.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-C4 offline VM snapshot record tests failed.' }
      - name: "T4-C5: private multi-session coverage review (synthetic, NO VM access)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4c5_multi_session_review.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-C5 offline multi-session tests failed.' }
      - name: "T4-B4/B5: synthetic staged PE and offline evidence reconciliation (NO registration)"
        shell: pwsh
        run: |
          python tools/test_meltia_t4b4_native_artifact_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-B4 PE structure tests failed.' }
          python tools/test_meltia_t4b5_offline_review_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'T4-B5 fail-closed evidence tests failed.' }
      - name: "T3a: validate isolated native TIP staging (never install)"
        shell: pwsh
        run: |
          python tools/test_meltia_t3a_stage.py
          if ($LASTEXITCODE -ne 0) { throw 'Meltia T3a staging contracts failed.' }
      - name: "T3b: verify C# and native v1 protocol contracts (offline only)"
        shell: pwsh
        run: |
          python tools/generate_meltia_tip_identity.py --check
          if ($LASTEXITCODE -ne 0) { throw 'T3b generated identity mismatch.' }
          python tools/test_meltia_t3b_protocol.py
          if ($LASTEXITCODE -ne 0) { throw 'T3b source contracts failed.' }
          dotnet run --project src/Meltia.TipProtocol.Tests/Meltia.TipProtocol.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'T3b managed wire tests failed.' }
      - name: "T3a: build experimental MeltiaTip.dll x64 and x86 (no registration)"
        shell: pwsh
        run: |
          ./tools/build-meltia-tip-no-registration.ps1 -Architecture Both
          if ($LASTEXITCODE -ne 0) { throw 'Meltia T3a isolated native compile failed.' }
      - name: "T3c-A: exercise real x64/x86 native-to-managed Named Pipe v1 (no registration)"
        shell: pwsh
        run: |
          ./tools/test-meltia-t3c-pipe.ps1 -Architecture Both
          if ($LASTEXITCODE -ne 0) { throw 'T3c native/C# pipe fixture failed.' }
      - name: "T3c-B: real TipServer/Session x64 and x86, same-client reconnect (no registration)"
        shell: pwsh
        run: |
          ./tools/test-meltia-t3c-b-host.ps1 -Architecture Both
          if ($LASTEXITCODE -ne 0) { throw 'T3c-B real TipServer test failed.' }
      - name: "T3d: real native TextService::Request IPC (no registration)"
        shell: pwsh
        run: |
          ./tools/test-meltia-t3d-request.ps1 -Architecture Both
          if ($LASTEXITCODE -ne 0) { throw 'T3d native Request integration failed.' }
      - name: "T3e: experimental host startup, exclusive mutex, stop, crash-restart (no registration)"
        shell: pwsh
        run: |
          python tools/test_meltia_t3e_host_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'T3e host safety contract failed.' }
          ./tools/test-meltia-t3e-host.ps1
          if ($LASTEXITCODE -ne 0) { throw 'T3e Windows host lifecycle failed.' }
      - name: "T3f: bounded offline host watchdog, listener loss and crash recovery (no registration)"
        shell: pwsh
        run: |
          python tools/test_meltia_t3f_supervisor_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'T3f supervisor source gate failed.' }
          ./tools/test-meltia-t3f-supervisor.ps1
          if ($LASTEXITCODE -ne 0) { throw 'T3f supervisor Windows E2E failed.' }
      - name: "T3g: supervisor kill reaps owned worker via Job Object (no registration)"
        shell: pwsh
        run: |
          python tools/test_meltia_t3g_job_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'T3g Job Object source contract failed.' }
          ./tools/test-meltia-t3g-job.ps1
          if ($LASTEXITCODE -ne 0) { throw 'T3g supervisor-death Windows E2E failed.' }
      - name: Verify inherited TIP IPC cross-layer source contract (no TSF registration)
        shell: pwsh
        run: |
          python tools/test_meltia_tip_ipc_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Meltia T1-B TIP IPC source contract failed.' }
      - name: Guard Keyboard Preview against accidental upstream TSF/update wiring
        shell: pwsh
        run: |
          python tools/test_meltia_keyboard_preview_isolation.py
          if ($LASTEXITCODE -ne 0) { throw 'Meltia Keyboard Preview isolation guard failed.' }
      - name: Inherited Meltype Core regression tests
        shell: pwsh
        run: |
          dotnet run --project src/Meltype.Core.Tests/Meltype.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Meltype Core regressions failed.' }
      - name: Publish actual Windows Preview and launch hook-free self-test
        shell: pwsh
        run: |
          ./tools/build-meltia-windows-preview.ps1 -FrameworkDependent
      - name: Audit executable, ZIP, licenses and self-test report
        shell: pwsh
        run: |
          ./tools/Test-MeltiaWindowsPreviewArtifact.ps1
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meltia-preview-ci-windows
          path: |
            artifacts/meltia-windows-preview-win-x64-framework-dependent.zip
            artifacts/meltia-windows-preview-win-x64-framework-dependent/meltia-preview-selftest.json
          if-no-files-found: warn
          retention-days: 14

  research-quality-full:
    name: Core and Bridge full research quality (1,067 + benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Run all 1,067 synthetic boundary examples, bridge contracts and offline benchmark
        run: python3 tools/run-meltia-quality.py --tier full --output-dir artifacts/meltia-quality
      - name: Upload JSON reports and benchmark evidence even on failure
        if: always()
